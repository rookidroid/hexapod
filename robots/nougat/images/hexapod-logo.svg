<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Hexapod</title>
  <!-- RX-78-2 palette, shared with the web UI -->
  <defs>
    <style>
      .ink{stroke:#1b2a4a;stroke-width:7;stroke-linejoin:round}
      .armor{fill:#ffffff}
      .blue{fill:#1d4fa3}
      .red{fill:#d62828}
      .yellow{fill:#f2b705}
    </style>

    <!-- One leg, mounted at the origin and reaching along +x -->
    <g id="femur">
      <path class="armor ink" d="M-10,-22 L56,-18 L74,0 L56,18 L-10,22 Z"/>
    </g>
    <g id="tibia">
      <path class="armor ink" d="M0,-20 L50,-14 L76,0 L50,14 L0,20 Z"/>
      <path class="red" d="M53.5,-12.5 L72,0 L53.5,12.5 Z"/>
    </g>
    <g id="knee">
      <circle class="blue ink" r="17"/>
    </g>
  </defs>

  <!-- Badge: navy plate chamfered top-right and bottom-left, like the UI's panels -->
  <path d="M10,10 H430 L502,82 V502 H82 L10,430 Z" fill="#1b2a4a"/>

  <g id="robot" transform="translate(256,244) scale(1.05) translate(-256,-250)">
  <!-- Right legs: front, middle, back; the knee bends the tibia away from the middle -->
  <g id="legs-right">
    <g transform="translate(314,204) rotate(-40)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0) rotate(-20)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
    <g transform="translate(320,262)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
    <g transform="translate(314,320) rotate(40)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0) rotate(20)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
  </g>
  <!-- Left legs mirror the right -->
  <use xlink:href="#legs-right" transform="translate(512,0) scale(-1,1)"/>

  <!-- Torso, seen from above: white armour with a red head plate,
       a blue chest and a yellow waist band -->
  <path class="red ink" d="M234,114 H278 L292,130 V156 H220 V130 Z"/>
  <path class="armor ink" d="M222,146 H290 L324,192 V330 L290,374 H222 L188,330 V192 Z"/>
  <path class="blue ink" d="M228,172 H284 L302,194 V262 H210 V194 Z"/>
  <rect class="yellow ink" x="210" y="284" width="92" height="20"/>
  </g>
</svg>
