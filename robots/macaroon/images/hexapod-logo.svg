<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Hexapod</title>
  <!-- RX-78-2 palette, shared with the web UI -->
  <defs>
    <style>
      .ink{stroke:#1b2a4a;stroke-width:7;stroke-linejoin:round}
      .armor{fill:#ffffff}
      .blue{fill:#1d4fa3}
      .red{fill:#d62828}
      .yellow{fill:#f2b705}
    </style>

    <!-- One leg, mounted at the origin and reaching along +x -->
    <g id="femur">
      <path class="armor ink" d="M-10,-22 L56,-18 L74,0 L56,18 L-10,22 Z"/>
    </g>
    <g id="tibia">
      <path class="armor ink" d="M0,-20 L50,-14 L76,0 L50,14 L0,20 Z"/>
      <path class="red" d="M53.5,-12.5 L72,0 L53.5,12.5 Z"/>
    </g>
    <g id="knee">
      <circle class="blue ink" r="17"/>
    </g>
  </defs>

  <!-- Badge: navy plate chamfered top-right and bottom-left, like the UI's panels -->
  <path d="M10,10 H430 L502,82 V502 H82 L10,430 Z" fill="#1b2a4a"/>

  <!-- Robot, seen from above, centred on the badge and turned 45 degrees -->
  <g id="robot" transform="translate(256,256) rotate(45) scale(0.94)">
  <!-- Six legs, one from each corner of the body, 60 degrees apart -->
  <g id="legs">
    <g transform="rotate(0) translate(100,0)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
    <g transform="rotate(60) translate(100,0)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
    <g transform="rotate(120) translate(100,0)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
    <g transform="rotate(180) translate(100,0)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
    <g transform="rotate(240) translate(100,0)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
    <g transform="rotate(300) translate(100,0)">
      <use xlink:href="#femur"/>
      <g transform="translate(72,0)"><use xlink:href="#tibia"/></g>
      <use xlink:href="#knee" x="72"/>
    </g>
  </g>

  <!-- Torso: a regular hexagon of white armour with a blue deck
       and a yellow hub -->
  <polygon class="armor ink" points="106.0,0.0 53.0,91.8 -53.0,91.8 -106.0,0.0 -53.0,-91.8 53.0,-91.8"/>
  <polygon class="blue ink" points="70.0,0.0 35.0,60.6 -35.0,60.6 -70.0,0.0 -35.0,-60.6 35.0,-60.6"/>
  <circle class="yellow ink" r="24"/>
  </g>
</svg>
